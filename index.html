<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKR AI - Special Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #050b14;
      --card-bg: rgba(10, 25, 47, 0.75);
      --primary-blue: #00d2ff;
      --deep-blue: #0052d4;
      --neon-green: #00ff87;
      --text-color: #e2e8f0;
      --glow-blue: 0 0 20px rgba(0, 210, 255, 0.6);
      --glow-green: 0 0 15px rgba(0, 255, 135, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-color);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 82, 212, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0, 255, 135, 0.1) 0%, transparent 40%);
    }

    /* --- Splash Screen --- */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #02060e;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
      transition: opacity 0.8s ease, visibility 0.8s;
      padding: 20px;
      text-align: center;
    }

    .name-card {
      background: var(--card-bg);
      border: 1px solid rgba(0, 210, 255, 0.3);
      padding: 35px 25px;
      border-radius: 20px;
      box-shadow: 0 0 35px rgba(0, 82, 212, 0.4);
      backdrop-filter: blur(15px);
      max-width: 450px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .name-card h2 {
      color: var(--primary-blue);
      font-size: 1.4rem;
      text-shadow: 0 0 10px var(--primary-blue);
    }

    .name-input {
      width: 100%;
      background: rgba(15, 30, 55, 0.8);
      border: 1px solid rgba(0, 210, 255, 0.4);
      padding: 14px 18px;
      border-radius: 12px;
      color: #fff;
      font-size: 1.1rem;
      text-align: center;
      outline: none;
      transition: all 0.3s;
    }

    .name-input:focus {
      border-color: var(--neon-green);
      box-shadow: var(--glow-green);
    }

    .splash-text {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary-blue);
      text-shadow: 0 0 10px var(--primary-blue), 0 0 25px var(--deep-blue);
      line-height: 1.6;
      display: none;
      animation: pulseGlow 2s infinite alternate;
      margin-top: 15px;
    }

    .enter-btn {
      padding: 12px 35px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #000;
      background: linear-gradient(135deg, var(--primary-blue), var(--neon-green));
      border: none;
      border-radius: 30px;
      box-shadow: var(--glow-green);
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      width: 100%;
    }

    .enter-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 0 25px var(--neon-green);
    }

    /* --- Main Chat Layout --- */
    #chat-container {
      width: 100%;
      max-width: 900px;
      height: 90vh;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 210, 255, 0.2);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 30px rgba(0, 82, 212, 0.3);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.6s ease;
    }

    #chat-container.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Header */
    header {
      padding: 20px;
      border-bottom: 1px solid rgba(0, 210, 255, 0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--primary-blue);
      text-shadow: 0 0 12px var(--primary-blue);
      letter-spacing: 1px;
    }

    .badge {
      font-size: 0.8rem;
      padding: 4px 12px;
      border-radius: 12px;
      background: rgba(0, 255, 135, 0.1);
      color: var(--neon-green);
      border: 1px solid var(--neon-green);
      box-shadow: var(--glow-green);
    }

    /* Chat Messages */
    #chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    #chat-box::-webkit-scrollbar {
      width: 6px;
    }
    #chat-box::-webkit-scrollbar-thumb {
      background: var(--deep-blue);
      border-radius: 10px;
    }

    .msg {
      max-width: 80%;
      padding: 14px 18px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 0.98rem;
      word-wrap: break-word;
      animation: fadeIn 0.3s ease;
    }

    .user-msg {
      align-self: flex-start;
      background: linear-gradient(135deg, rgba(0, 82, 212, 0.6), rgba(0, 210, 255, 0.4));
      border: 1px solid var(--primary-blue);
      color: #fff;
      box-shadow: var(--glow-blue);
      border-bottom-right-radius: 2px;
    }

    .bot-msg {
      align-self: flex-end;
      background: rgba(10, 20, 35, 0.8);
      border: 1px solid var(--neon-green);
      color: #e2e8f0;
      box-shadow: var(--glow-green);
      border-bottom-left-radius: 2px;
    }

    /* Input Area */
    .input-container {
      padding: 15px 20px;
      border-top: 1px solid rgba(0, 210, 255, 0.15);
      display: flex;
      gap: 12px;
      background: rgba(5, 11, 20, 0.8);
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
    }

    input[type="text"].chat-input {
      flex: 1;
      background: rgba(15, 30, 55, 0.6);
      border: 1px solid rgba(0, 210, 255, 0.3);
      padding: 14px 18px;
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s;
    }

    input[type="text"].chat-input:focus {
      border-color: var(--primary-blue);
      box-shadow: var(--glow-blue);
    }

    button.send-btn {
      background: linear-gradient(135deg, var(--deep-blue), var(--primary-blue));
      border: none;
      color: #fff;
      padding: 0 25px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--glow-blue);
      transition: all 0.3s ease;
    }

    button.send-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px var(--primary-blue);
    }

    /* Animations */
    @keyframes pulseGlow {
      from { text-shadow: 0 0 10px var(--primary-blue), 0 0 20px var(--deep-blue); }
      to { text-shadow: 0 0 20px var(--primary-blue), 0 0 35px var(--primary-blue), 0 0 50px var(--neon-green); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash-screen">
    <div class="name-card" id="inputCard">
      <h2>مرحباً بك في AKR AI ✨</h2>
      <input type="text" id="usernameInput" class="name-input" placeholder="Put your name..." onkeydown="handleNameKey(event)" />
      <button class="enter-btn" onclick="submitName()">تأكيد ودخول 🚀</button>
    </div>

    <div class="splash-text" id="welcomeText">
      <!-- النص الديناميكي هيظهر هنا -->
    </div>
  </div>

  <!-- Main App -->
  <div id="chat-container">
    <header>
      <div class="brand">AKR AI</div>
      <div class="badge">Special Edition</div>
    </header>

    <div id="chat-box">
      <!-- الترحيب الأولي هينزل تلقائي باسم المستخدم -->
    </div>

    <div class="input-container">
      <input type="text" id="userInput" class="chat-input" placeholder="اكتب رسالتك هنا..." onkeydown="handleKey(event)" />
      <button class="send-btn" onclick="sendMessage()">إرسال</button>
    </div>
  </div>

  <script>
    let userName = "";

    function handleNameKey(e) {
      if (e.key === 'Enter') submitName();
    }

    function submitName() {
      const input = document.getElementById('usernameInput');
      const val = input.value.trim();

      if (!val) {
        input.style.borderColor = 'red';
        return;
      }

      userName = val;

      // إخفاء كارت الإدخال وتجهيز الرسالة المخصصة
      document.getElementById('inputCard').style.display = 'none';
      const welcomeEl = document.getElementById('welcomeText');
      
      welcomeEl.innerHTML = `Ai version as special edition for ${userName}<br>All rights reserved for AKR`;
      welcomeEl.style.display = 'block';

      // انتظار ثانيتين لإظهار الجلو والترحيب قبل الدخول للشات
      setTimeout(() => {
        startApp();
      }, 1800);
    }

    function startApp() {
      const splash = document.getElementById('splash-screen');
      const chat = document.getElementById('chat-container');
      const chatBox = document.getElementById('chat-box');
      
      // وضع أول رسالة ترحيبية من الـ AI مخصصة بالاسم
      chatBox.innerHTML = `<div class="msg bot-msg">أهلاً بك يا ${userName}! نظام AKR AI جاهز وفي خدمتك. اؤمرني يا برو! ⚡</div>`;

      splash.style.opacity = '0';
      splash.style.visibility = 'hidden';
      
      setTimeout(() => {
        chat.classList.add('visible');
      }, 300);
    }

    function handleKey(e) {
      if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const chatBox = document.getElementById('chat-box');
      const text = input.value.trim();

      if (!text) return;

      // إضافة رسالة المستخدم
      chatBox.innerHTML += `<div class="msg user-msg">${text}</div>`;
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      // رسالة انتظار
      const loadingId = 'loading-' + Date.now();
      chatBox.innerHTML += `<div class="msg bot-msg" id="${loadingId}">جاري التفكير... 🧠</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        // إرسال الطلب مع اسم المستخدم للسيرفر
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            message: text,
            user: userName 
          })
        });

        const data = await res.json();
        const loadingEl = document.getElementById(loadingId);

        if (res.ok) {
          loadingEl.innerText = data.reply;
        } else {
          loadingEl.innerText = "حصلت مشكلة ف الاتصال! تأكد من إعدادات Vercel API Key.";
          loadingEl.style.borderColor = "red";
        }
      } catch (err) {
        const loadingEl = document.getElementById(loadingId);
        if(loadingEl) loadingEl.innerText = "خطأ في الشبكة يا برو!";
      }

      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
